# ============================================================
# 通用模板 pytest.ini（可复用到任意 pytest 项目）
# ------------------------------------------------------------
# 使用方式：拷贝本文件到目标 pytest 项目根目录（与 conftest.py 同级），
#          按下方【必改项】核对修改后即可生效。
# 说明: 本文件需与执行 pytest 的当前目录一致，否则配置不生效
#
# Allure 报告查看命令（在项目根目录执行）:
#   1. 生成 HTML 报告:  allure generate allure-results -o allure-report --clean
#   2. 打开报告:       allure open allure-report
#
# 【必改项】testpaths：目标项目用例目录不同时，必须修改或删除本行
# ============================================================

[pytest]

# 【必改项】本地浏览器与驱动路径：模板 conftest.py 的 driver fixture 从这里读取，
# 拷贝到新项目后改为目标机器的 Chrome / chromedriver 绝对路径
browser = D:\PythonProject\chrome-win64\chrome.exe
browser_driver = D:\PythonProject\drivers\chromedriver.exe

# 指定测试用例所在目录（相对项目根目录）
testpaths = testcases

# 测试文件命名规则（自动收集依据）
python_files = test_*.py *_test.py

# 默认命令行参数: 实时显示 print + 详细输出(-v) + Allure 结果收集
# --capture=tee-sys: 屏幕实时显示 print，同时失败用例报告中保留输出（比 -s 排错信息更全）
# --reruns=2: 用例失败后自动重跑，最多 2 次（pytest-rerunfailures 插件）
addopts = --capture=tee-sys -v --alluredir=allure-results --clean-alluredir --reruns=0

log_file = pytest.log
# 每次运行覆盖旧日志（默认 append 模式会让 pytest.log 无限增长）
log_file_mode = w
log_file_level = info
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s]  : %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S


# 常用标记注册（避免 PytestUnknownMarkWarning；可按项目需要增删）
markers =
    smoke: 冒烟测试，覆盖核心主流程
    regression: 回归测试
    login: 登录模块相关用例
    ui: UI 自动化用例
    api: 接口自动化用例
    p0: 高优先级用例
    p1: 中优先级用例
    p2: 低优先级用例

# 跳过目录（不递归收集其中的用例）
# 注意：自定义本项会整体覆盖 pytest 默认值；.* 通配必须保留，
# 它负责跳过 .pytest_cache / .idea / .venv 等点目录（漏掉会导致收集时
# 误入这些目录，例如 .pytest_cache 被锁时会直接 PermissionError）。
# 前半段为 pytest 默认项，后半段为本项目产物/资源目录
norecursedirs = .* *.egg CVS _darcs build dist node_modules venv {arch} allure-report allure-report-single allure-results chrome-win64 drivers temp lib
